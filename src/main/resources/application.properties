# Nombre de la aplicacion
spring.application.name=trabajo-infantil

# Conexion a PostgreSQL
# Los valores se definen como variables de entorno.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway administra las tablas
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration

# Limites para la carga de archivos
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

# Duracion maxima de inactividad de la sesion
server.servlet.session.timeout=30m

# Render proporciona PORT. En local se usa 8080.
server.port=${PORT:8080}

# Direccion permitida del frontend
app.cors.origin=${FRONTEND_ORIGIN:http://localhost:5173}

# Creacion del administrador inicial
# Se habilita por variables de entorno cuando corresponda.
app.admin.inicial.habilitado=${ADMIN_INICIAL_HABILITADO:false}
app.admin.inicial.nombre=${ADMIN_INICIAL_NOMBRE:}
app.admin.inicial.correo=${ADMIN_INICIAL_CORREO:}
app.admin.inicial.password=${ADMIN_INICIAL_PASSWORD:}